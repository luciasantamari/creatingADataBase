name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Download the repository
        uses: actions/checkout@v4

      - name: Set  Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m pytest -v tests.py

      - name: Run test
        run: python -m pytest -v
